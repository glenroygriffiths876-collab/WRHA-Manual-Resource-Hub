name: WRHA Hub - Validate and Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wrha-pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application files and catalogues
        run: node audit.mjs
      - name: Install browserless DOM test dependencies
        run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Exercise navigation, search, law and parish interactions
        run: node smoke.mjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build clean public site (verified roles only; exclude research archives)
        run: |
          set -e
          mkdir -p _site/assets _site/covers
          cp index.html styles.css enhance.css viewer.css roles-evidence.css hub-utilities.css pwa-install.css \
             data.js catalog-extra.js document-overrides.js establishment-resource.js \
             verified-role-public.js app-v2.js viewer.js hub-utilities.js pwa-install.js manifest.webmanifest sw.js wrha-logo.webp jamaicaHigh.svg _site/
          cp assets/mohw-logo.png assets/wrha-hub-share-qr.svg _site/assets/
          cp -r assets/app-icons _site/assets/app-icons
          find covers -maxdepth 1 -name '*.webp' -type f -exec cp {} _site/covers/ \;
          touch _site/.nojekyll
          test -f _site/verified-role-public.js
          test -s _site/assets/wrha-hub-share-qr.svg
          test -s _site/hub-utilities.js
          test -s _site/pwa-install.js
          test -s _site/sw.js
          test -s _site/manifest.webmanifest
          test -s _site/assets/app-icons/wrha-icon-192.png
          test -s _site/assets/app-icons/wrha-maskable-512.png
          test -s _site/assets/app-icons/apple-touch-icon.png
          if test -e _site/role-evidence.js; then
            echo "Unverified legacy roles were accidentally included in deployment"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
