name: Recover remaining files and verify production reader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-reader-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: node scripts/check-public-document-build.mjs .
      - run: python scripts/recover-final-alternates.py
      - run: node scripts/check-public-document-build.mjs .
      - name: Commit authentic alternate PDFs and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'WRHA document recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/library/ document-library-manifest.js covers/ reports/alternate-source-publication.json
          if ! git diff --cached --quiet; then
            git commit -m 'Recover additional government and FAOLEX source PDFs'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
  live-reader:
    needs: recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-reader-exhaustive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reader-resource-by-resource
          path: artifacts/
          if-no-files-found: warn
