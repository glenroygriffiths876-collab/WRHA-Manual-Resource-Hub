name: Verify local-only production reader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-reader-verification.yml'
  workflow_dispatch:
    inputs:
      recover_again:
        description: Retry alternate source recovery before browser test
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
jobs:
  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_again
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: node scripts/check-public-document-build.mjs .
      - run: python scripts/recover-final-alternates.py
      - run: node scripts/check-public-document-build.mjs .
      - name: Commit authentic alternate PDFs and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'WRHA document recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/library/ document-library-manifest.js covers/ reports/alternate-source-publication.json
          if ! git diff --cached --quiet; then
            git commit -m 'Recover additional government and FAOLEX source PDFs'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
  live-reader:
    needs: recovery
    if: ${{ always() && (needs.recovery.result == 'success' || needs.recovery.result == 'skipped') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/live-reader-exhaustive.mjs
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '4'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reader-resource-by-resource-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: warn
