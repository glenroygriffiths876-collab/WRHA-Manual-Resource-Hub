name: Verify every published document link
on:
  workflow_dispatch:
  push:
    branches:
      - fix-embedded-pdf-reader-20261112
      - main
    paths:
      - 'document-overrides.js'
      - 'catalog-extra.js'
      - 'data.js'
      - 'scripts/audit_documents.py'
      - 'scripts/export-document-index.mjs'
      - '.github/workflows/document-audit.yml'
  schedule:
    - cron: '23 8 1 * *'
permissions:
  contents: write
concurrency:
  group: wrha-document-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests beautifulsoup4
      - name: Export final document URLs after overrides
        run: node scripts/export-document-index.mjs
      - name: Verify all document responses, PDF magic bytes and link candidates
        run: python scripts/audit_documents.py
      - name: Save all audit results into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/document-index.json reports/document-audit.json reports/document-audit-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified document URL audit report"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Audit report published"
                exit 0
              fi
              echo "Concurrent update; retrying safely"
              sleep 3
            done
            echo "Unable to publish audit after 3 safe retries"
            exit 1
          fi
