name: Fast Parliament reference PDF recovery
on:
  push:
    branches: [recover-parliament-pdfs-20261117]
    paths:
      - '.github/workflows/recover-parliament-pdfs.yml'
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: node scripts/check-public-document-build.mjs .
      - run: python scripts/recover-parliament-pdfs.py
      - run: node scripts/check-public-document-build.mjs .
      - name: Commit actual verified PDF bytes on recovery branch
        run: |
          git config user.name 'WRHA document recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/library/ document-library-manifest.js covers/ reports/parliament-recovery.json
          git commit -m 'Store verified Houses of Parliament reference PDF files'
          git push origin HEAD:recover-parliament-pdfs-20261117
