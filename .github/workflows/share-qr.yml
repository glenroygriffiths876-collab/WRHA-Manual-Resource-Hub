name: Generate WRHA Hub share QR
on:
  push:
    branches: [waps-style-feedback-issue-share]
    paths:
      - '.github/workflows/share-qr.yml'
      - 'scripts/build_share_qr.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'qrcode>=8,<9'
      - name: Build QR SVG for canonical WRHA home link
        run: python scripts/build_share_qr.py
      - name: Publish local QR image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wrha-hub-share-qr.svg
          if ! git diff --cached --quiet; then
            git commit -m "Add verified canonical WRHA Hub QR asset"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
