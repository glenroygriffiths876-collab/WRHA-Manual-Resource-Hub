name: Publish authorized local PDF library
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-authorized-local-library.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: wrha-authorized-publication
  cancel-in-progress: false
jobs:
  publish-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf pillow
      - run: node scripts/check-public-document-build.mjs .
      - run: python scripts/publish-authorized-library.py pdf
      - run: node scripts/check-public-document-build.mjs .
      - name: Commit actual PDF files and manifest in one transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name 'WRHA document recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documents/library/ document-library-manifest.js covers/ reports/authorized-publication-pdf.json
          git commit -m 'Host authorized public manuals and legislation as actual local PDFs'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorized-pdf-publication-report
          path: reports/authorized-publication-pdf.json
          if-no-files-found: warn
  convert:
    needs: publish-pdf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderers and isolated Office conversion
        run: |
          python -m pip install pymupdf pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: node scripts/check-public-document-build.mjs .
      - run: python scripts/publish-authorized-library.py convert
      - run: node scripts/check-public-document-build.mjs .
      - name: Commit converted PDF and original public document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name 'WRHA document recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add document-library-manifest.js documents/library/ covers/ reports/authorized-publication-convert.json
          if test -d documents/originals; then git add documents/originals; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Host authorized converted Office and image resources'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorized-conversion-report
          path: reports/authorized-publication-convert.json
          if-no-files-found: warn
