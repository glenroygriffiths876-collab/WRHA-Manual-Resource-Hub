name: Validate document library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'documents/source-register.json'
      - 'documents/approved-inputs.json'
      - 'documents/inbox/**'
      - 'tools/prepare-document-library.py'
      - '.github/workflows/document-library-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document renderers
        run: |
          python -m pip install pymupdf pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Validate exact files and prepare approved documents
        run: python tools/prepare-document-library.py --verify-jasdis --publish-approved
      - name: Store preflight report and reviewed-output candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-library-preflight
          path: |
            documents/preflight-report.json
            documents/review/
            documents/library/
            document-library-manifest.js
            covers/
          if-no-files-found: warn
          retention-days: 7
