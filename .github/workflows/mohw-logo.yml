name: Retrieve official MOHW logo asset
on:
  push:
    branches: [fix-pdf-visible-roles-evidence-mohw-footer]
    paths: ['.github/workflows/mohw-logo.yml','scripts/cache_mohw_logo.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests beautifulsoup4
      - name: Identify official MOHW logo (no fake substitutes)
        run: python scripts/cache_mohw_logo.py
      - name: Commit official original artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mohw-logo.*
          if ! git diff --cached --quiet; then
            git commit -m "Use authentic MOHW official logo"
            git push
          fi
