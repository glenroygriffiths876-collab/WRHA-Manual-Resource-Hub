name: Embedded PDF reader regression tests
on:
  push:
    branches: [fix-embedded-pdf-reader-20261112, verified-roles-and-mofps-establishment]
  pull_request:
    paths:
      - 'index.html'
      - 'viewer.js'
      - 'viewer.css'
      - 'document-overrides.js'
      - 'app-v2.js'
      - 'verified-role-public.js'
      - 'establishment-resource.js'
      - 'catalog-extra.js'
      - 'smoke.mjs'
      - 'audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalogue, corrected direct URLs, and JS syntax
        run: node audit.mjs
      - name: Install isolated browser DOM for interactions
        run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Run in-app PDF reader and existing navigation smoke tests
        run: node smoke.mjs
      - name: Ensure declared PDFs use document URLs
        run: |
          node scripts/export-document-index.mjs
          node scripts/check-document-urls.mjs
