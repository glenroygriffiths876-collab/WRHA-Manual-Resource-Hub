name: Embedded PDF reader regression tests
on:
  push:
    branches: [fix-embedded-pdf-reader-20261112]
  pull_request:
    paths:
      - 'index.html'
      - 'viewer.js'
      - 'viewer.css'
      - 'document-overrides.js'
      - 'app-v2.js'
      - 'smoke.mjs'
      - 'audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalogue, corrected direct URLs, and JS syntax
        run: node audit.mjs
      - name: Install isolated browser DOM for interactions
        run: npm install --no-save --no-audit --no-fund jsdom@24
      - name: Run in-app PDF reader and existing navigation smoke tests
        run: node smoke.mjs
      - name: Ensure PDF entries use real document or approved download endpoints
        run: |
          node scripts/export-document-index.mjs
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('reports/document-index.json'));const bad=a.filter(d=>d.format==='pdf' && (!d.url.startsWith('https://')||!(/\\.pdf(?:[?#]|$)|\\/download\\//i.test(d.url))));if(bad.length){console.error('Declared PDF entries with non-document-shaped URLs:',bad);process.exit(1)}console.log('All',a.filter(x=>x.format==='pdf').length,'declared PDFs have document-shaped URLs; remote HTTP audit runs separately.')"
