name: Browser PDF reader, hub utilities and WRHA PWA installation tests
on:
  push:
    branches: [fix-embedded-pdf-reader-20261112, fix-pdf-visible-roles-evidence-mohw-footer, verified-roles-and-mofps-establishment, waps-style-feedback-issue-share, installable-wrha-hub-pwa]
    paths:
      - 'index.html'
      - 'viewer.js'
      - 'hub-utilities.js'
      - 'pwa-install.js'
      - 'pwa-install.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/app-icons/**'
      - 'hub-utilities.css'
      - 'assets/wrha-hub-share-qr.svg'
      - 'viewer.css'
      - 'role-evidence.js'
      - 'roles-evidence.css'
      - 'assets/mohw-logo.png'
      - 'document-overrides.js'
      - 'app-v2.js'
      - 'verified-role-public.js'
      - 'establishment-resource.js'
      - 'catalog-extra.js'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-reader-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Test both document galleries and PDF modal in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Store screenshots for design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrha-pdf-reader-screens
          path: artifacts/
          if-no-files-found: ignore
